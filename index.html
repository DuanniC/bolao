<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a7d3b">
<title>Bolão – Mega da Virada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ink:#0e2a1d;--mut:#5f7a6c;--g:#12a154;--g2:#0a7d3b;--gd:#06452a;--mint:#e6f7ed;--line:#dbeee2;--y:#ffc62b;--y2:#f0a500;--red:#e5484d;--sh:0 14px 34px -16px rgba(6,69,42,.32),0 2px 6px rgba(6,69,42,.05);--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#f6fcf8;min-height:100vh;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(620px 420px at 8% -4%,#d3f3e1 0,transparent 70%),radial-gradient(520px 420px at 98% 4%,#fff0bd 0,transparent 70%),radial-gradient(760px 520px at 55% 112%,#d8ebff 0,transparent 70%),#f6fcf8}
a{color:var(--g2)}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.muted{color:var(--mut)}.center{text-align:center}
/* topo */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#15b862,#06452a);box-shadow:0 6px 14px -6px rgba(10,125,59,.8);flex:none}
.brand b{display:block;font-size:15px;line-height:1.15;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.sp{flex:1}
.dnav{display:none;gap:4px}
.dnav a,.bnav a{text-decoration:none;color:var(--mut);font-weight:700}
.dnav a{padding:9px 14px;border-radius:999px;font-size:14px;display:flex;gap:6px;align-items:center}
.dnav a i,.bnav a i{font-style:normal}
.dnav a.on,.dnav a:hover{background:var(--mint);color:var(--g2)}
.who{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px 4px 4px;font:700 13px var(--f);color:var(--ink);cursor:pointer}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffd75a,#f0a500);font-weight:800;color:#3a2a00;text-transform:uppercase;flex:none}
.who .wn{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .out{color:var(--mut);font-weight:600}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
body.hasnav:not(.focus) .bnav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bnav a{display:grid;justify-items:center;gap:1px;padding:6px 0;border-radius:14px;font-size:11px}
.bnav a i{font-size:20px}
.bnav a.on{background:var(--mint);color:var(--g2)}
main{padding-top:18px;padding-bottom:40px}
body.hasnav main{padding-bottom:96px}
body.focus main{padding-bottom:110px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px 16px 100px}
footer a{color:var(--mut)}
@media(min-width:820px){.dnav{display:flex}.bnav{display:none!important}body.hasnav main{padding-bottom:40px}footer{padding-bottom:30px}.who .wn{max-width:140px}}
/* elementos */
.card{background:#fff;border:1px solid rgba(219,238,226,.95);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.pill{display:inline-block;border:1.5px solid var(--g);color:var(--g2);background:#fff;border-radius:999px;padding:5px 14px;font:800 11px/1.2 var(--f);letter-spacing:.09em;text-transform:uppercase}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 22px;font:700 15px/1.1 var(--f);color:#fff;background:linear-gradient(135deg,var(--g),var(--g2));box-shadow:0 10px 20px -10px rgba(10,125,59,.85);cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none;text-align:center}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.98)}
.btn.big{width:100%;padding:16px;font-size:16px;min-height:52px}
.btn.gold{background:linear-gradient(135deg,#ffd75a,var(--y2));color:#3a2a00;box-shadow:0 10px 20px -10px rgba(240,165,0,.9)}
.btn.ghost{background:#fff;color:var(--g2);border:2px solid #cfe8d8;box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#f0646a,#d9363e);box-shadow:0 10px 20px -10px rgba(217,54,62,.8)}
.btn.sm{padding:8px 14px;min-height:36px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn.dgh{background:#fff;color:var(--red);border:2px solid #f6caca;box-shadow:none}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:14px 16px;border:2px solid #d5e8dc;border-radius:14px;background:#fff;color:var(--ink);outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(18,161,84,.15)}
textarea{resize:vertical;min-height:84px}
.hint{font-size:12.5px;color:var(--mut);margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.empty{padding:14px 4px;text-align:center}
.st{display:inline-block;padding:4px 10px;border-radius:999px;font:800 11px/1.2 var(--f);letter-spacing:.05em}
.st.PAGO{background:#d3f5df;color:#0a6a32}.st.PENDENTE{background:#fff0c2;color:#8a5a00}
.ball{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;font:800 14px var(--f);margin:2px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.ball.hit{background:linear-gradient(145deg,#ffd75a,var(--y2));color:#3a2a00}
.ball.sm{width:29px;height:29px;font-size:12px}.ball.lg{width:100%;height:auto;aspect-ratio:1;font-size:19px;margin:0}
.notices{display:grid;gap:8px;margin-top:16px}
.notice{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.paynote{background:#fff8dd;border-color:#f3dc87;margin-top:14px;font-size:15px}
.pxs{min-height:20px;margin-top:8px;font-size:13px;font-weight:600}.pxok{color:#0a6a32}.pxp{color:var(--mut)}.pxe{color:#c0272d}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.ggrid .stat small:last-child{margin-top:2px}
.gsel{width:auto;padding:5px 26px 5px 10px;font-size:13px;font-weight:700;border-radius:999px;border-width:1.5px;background-color:#f1f7f3}
.gb{display:inline-block;border-radius:999px;padding:3px 10px;font:800 11px/1.2 var(--f)}.gb.familia{background:#d3f5df;color:#0a6a32}.gb.trabalho{background:#dbe9ff;color:#1c4fa3}.gb.none{background:#eef1ef;color:#667}
.notice.warn{border-color:#f3c7c7;background:#fff5f5;color:#9b2226;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
/* login */
.hero{display:grid;gap:22px;padding:14px 0 6px}
.hero h1{font-size:clamp(34px,7vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1.03;margin:14px 0 12px}
.hl{background:linear-gradient(90deg,#0fa958,#e9a400);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:17px;color:var(--mut);max-width:520px}
.login h2{font-size:24px}
.login{padding:24px}
@media(min-width:860px){.hero{grid-template-columns:1.1fr .9fr;gap:44px;align-items:center;padding:34px 0 10px}}
.sec-h{text-align:center;margin:46px 0 20px}.sec-h h2{font-size:clamp(26px,4.5vw,36px);margin-top:12px;font-weight:800}.sec-h p{margin-top:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.step{text-align:center;position:relative;padding:26px 20px}
.step .n{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ff6b9a,#e0357a);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;box-shadow:0 6px 12px -4px rgba(224,53,122,.6)}
.step .ic{font-size:38px;display:block;margin-bottom:8px}.step h3{font-size:17px;margin-bottom:4px}.step p{color:var(--mut);font-size:14px}
.band{margin:48px -16px 0;background:linear-gradient(135deg,#0fa958,#06452a);color:#fff;text-align:center;padding:62px 20px 44px;position:relative;border-radius:0}
.band svg{position:absolute;top:-1px;left:0;width:100%;height:34px;display:block}
.band h2{font-size:clamp(24px,4.5vw,34px);font-weight:800}.band p{opacity:.85;margin:8px 0 20px}
.band .btn{width:auto;display:inline-flex}
@media(min-width:700px){.band{margin-left:0;margin-right:0;border-radius:32px;padding-top:44px}.band svg{display:none}}
/* início */
.welcome{background:linear-gradient(135deg,#10b05b 0,#06452a 100%);color:#fff;border-radius:28px;padding:24px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.welcome::before,.welcome::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.welcome::before{width:220px;height:220px;right:-60px;top:-80px}.welcome::after{width:120px;height:120px;right:70px;bottom:-60px;background:rgba(255,198,43,.18)}
.welcome>*{position:relative;z-index:1}
.welcome h1{font-size:clamp(26px,5vw,38px);font-weight:800;margin:12px 0 6px}
.welcome .pill{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.welcome p{opacity:.9}
.welcome .notice{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.tile{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:12px 14px}
.tile small{display:block;opacity:.8;font-weight:600;font-size:12px}.tile b{font-size:22px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}.welcome{padding:32px}}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:16px}
.act{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh);transition:transform .15s}
.act:hover{transform:translateY(-2px)}
.act .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:var(--mint);flex:none}
.act.gold .ic{background:#fff1c2}.act b{display:block;font-size:16px}.act small{color:var(--mut)}.act .ar{margin-left:auto;color:var(--g2);font-size:20px}
.alert{background:#fff8dd;border:1.5px solid #f3dc87;border-radius:20px;padding:16px;margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.alert .t{flex:1;min-width:200px}
/* jogar */
.play{display:grid;gap:16px}
@media(min-width:900px){.play{grid-template-columns:1.5fr 1fr;align-items:start}.sticky{position:sticky;top:78px}}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}.ch h2,.ch h3{font-size:20px}
.tray{display:flex;gap:8px;justify-content:center;margin:0 0 16px;padding:12px;border-radius:18px;background:var(--mint)}
.tray>*{flex:1;max-width:56px}
.slot{aspect-ratio:1;border-radius:50%;border:2px dashed #9fd3b5;display:block}
.numgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(min-width:640px){.numgrid{grid-template-columns:repeat(10,1fr)}}
.num{aspect-ratio:1;min-height:42px;border-radius:50%;border:2px solid #cfe8d8;background:#fff;color:var(--g2);font:800 16px var(--f);cursor:pointer;padding:0;transition:transform .12s,background .12s}
.num:hover{border-color:var(--g)}
.num.on{background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;border-color:transparent;transform:scale(1.08);box-shadow:0 6px 12px -4px rgba(10,125,59,.7)}
.num.dim{opacity:.4}
.acts3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.acts3 .full{grid-column:1/-1}
.dr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:14px;margin:8px 0;background:#fbfefc}
.dr.dup{border-color:#f0a3a6;background:#fff4f4}.dupmsg{color:#c0272d;font-size:12px;font-weight:700;margin:2px 4px}
.x{border:0;background:#fff;border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px;flex:none}
.total{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin:14px 0 12px;padding-top:12px;border-top:1px dashed var(--line)}.total b{font-size:24px;color:var(--g2)}
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px}
body.focus .sbar{display:flex}.sbar .si{flex:1;line-height:1.2}.sbar .si b{font-size:19px;display:block}.sbar .si small{color:var(--mut)}.sbar .btn{flex:1.1}
@media(min-width:900px){body.focus .sbar{display:none}body.focus main{padding-bottom:40px}}
/* pagamento */
.paywrap{max-width:560px;margin:0 auto}
.amount{font-size:40px;font-weight:800;color:var(--g2);letter-spacing:-.03em}
.qrbox{width:min(270px,74vw);margin:14px auto;padding:12px;background:#fff;border-radius:20px;border:1px solid var(--line);box-shadow:var(--sh)}
.qrbox svg{width:100%;height:auto;display:block}
.code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:#f3f8f5;border:1px solid var(--line);border-radius:14px;padding:12px;max-height:96px;overflow:auto;color:#2d4a3a;margin:10px 0}
.tm{display:inline-block;background:#fff0c2;color:#8a5a00;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
.ol{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px;text-align:left}.ol li{display:flex;gap:10px;font-size:14px}.ol li span{width:24px;height:24px;border-radius:50%;background:var(--mint);color:var(--g2);font-weight:800;display:grid;place-items:center;flex:none;font-size:12px}
/* meus jogos */
.seg{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:16px;max-width:420px}
.seg a{flex:1;text-align:center;padding:10px;border-radius:999px;text-decoration:none;color:var(--mut);font-weight:800;font-size:14px}.seg a.on{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff}
.draw{background:linear-gradient(135deg,#fff8dd,#fff);border:1.5px solid #f3dc87;text-align:center}
.draw .tray{background:transparent;padding:0;margin:12px 0 0}
.prize{background:linear-gradient(135deg,#fff3c4,#ffe08a);border:0;text-align:center;margin-bottom:14px}
.prize h3{font-size:22px}.prize .v{font-size:34px;font-weight:800;color:#6b4700}
.bt{margin:12px 0}.bth{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:6px}
.gm{padding:10px 0;border-top:1px dashed var(--line)}.gm small{color:var(--mut);font-weight:700;display:block}
/* admin */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--mut);border-radius:999px;padding:10px 16px;font:800 14px var(--f);cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-color:transparent}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.sgrid{grid-template-columns:repeat(3,1fr)}}@media(min-width:960px){.sgrid{grid-template-columns:repeat(6,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}.stat i{font-style:normal;font-size:20px}.stat small{display:block;color:var(--mut);font-weight:700;font-size:12px;margin-top:4px}.stat b{font-size:22px;display:block;letter-spacing:-.02em}
.h3{font-size:18px;margin:22px 0 10px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.tools input{flex:1;min-width:200px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fc{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:700 13px var(--f);color:var(--mut);cursor:pointer}.fc.on{background:var(--mint);color:var(--g2);border-color:var(--g)}
.ucard{background:#fff;border:1px solid var(--line);border-radius:20px;margin:10px 0;box-shadow:var(--sh);overflow:hidden}
.uh{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.um{flex:1;min-width:0}.um b{display:block}.um small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.um .sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sm2{font-size:12px;font-weight:700;background:#f1f7f3;border-radius:999px;padding:3px 10px;color:#35574a}
.ub{border-top:1px solid var(--line);padding:6px 14px 14px;background:#fbfefc}
.gl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.chev{color:var(--mut);transition:transform .2s;flex:none}.open .chev{transform:rotate(180deg)}
.qi{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px dashed var(--line)}.qi:first-child{border-top:0}
.rn{text-align:center;padding:12px 4px}
.six{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cfg h3{margin:24px 0 2px;font-size:17px}.cfg h3:first-child{margin-top:0}
.sw{display:flex;align-items:center;gap:12px;background:var(--mint);padding:14px;border-radius:16px;margin-top:16px;cursor:pointer;font-weight:700}.sw input{width:22px;height:22px;flex:none}
.log{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #eef5f0;font-size:14px}.log time{color:var(--mut);white-space:nowrap;font-size:12px;font-weight:700;min-width:104px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid #eef5f0;text-align:left;vertical-align:middle}
.banner{background:#fff1f1;border:1.5px solid #f3c7c7;color:#8a1d22;border-radius:16px;padding:14px;margin:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.banner span{flex:1;min-width:200px}
/* feedback */
#toasts{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{background:#0e2a1d;color:#fff;padding:13px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);border-left:5px solid var(--g);animation:tin .25s ease}.toast.err{border-left-color:#ff6b6b}.toast.out{opacity:0;transform:translateY(-6px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.ov{position:fixed;inset:0;background:rgba(6,30,18,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:90;padding:16px;animation:fin .15s}
@keyframes fin{from{opacity:0}}

body.busy main{pointer-events:none}body.busy{cursor:progress}

const tlv=(i,v)=>i+String(v.length).padStart(2,'0')+v;

const p=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',pixKeyFmt(key)))+tlv('52','0000')+tlv('53','986')+tlv('54',Number(amt).toFixed(2))+tlv('58','BR')+tlv('59',(up(nm)||'BOLAO').slice(0,25))+tlv('60',(up(city)||'BRASIL').slice(0,15))+tlv('62',tlv('05',t))+'6304';return p+crc(p)}

async function play(){const d=await me();if(!d)return;S.have=d.games.length;S.need=Math.max(1,MIN-S.have);S.dup=null;
if(closedNow()){view(`<div class="card center paywrap"><h2>🔒 Inscrições encerradas</h2><p class="muted" style="margin:8px 0 18px">Não é mais possível adicionar jogos.</p><a class="btn" href="#/meus">Ver meus jogos</a></div>`);return}
view(`<div class="play"><div class="card"><div class="ch"><h2>Escolha 6 números</h2><span class="muted">de 01 a 60</span></div>
<div class="tray" id="tray"></div><div class="numgrid" id="grid">${Array.from({length:60},(_,i)=>`<button type="button" class="num" data-n="${i+1}" onclick="tog(${i+1})">${pad(i+1)}</button>`).join('')}</div>
<div class="acts3"><button class="btn ghost" onclick="lucky()">✨ Surpresinha</button><button class="btn ghost" onclick="S.sel=[];paintPlay()">Limpar</button>
<button class="btn full" id="addb" onclick="addG()">➕ Adicionar jogo</button><button class="btn gold full" onclick="luckyN(3)">🎲 Gerar 3 surpresinhas de uma vez</button></div></div>
<aside class="card sticky"><div class="ch"><h3>Seus jogos (<span id="cnt">0</span>)</h3><span class="muted">${R(PRICE)} cada</span></div><div id="draft"></div>
<div class="total"><span>Total</span><b id="tot"></b></div><div class="notice" style="margin-bottom:12px">💸 Pagamento no momento da realização do jogo.</div><button class="btn big" onclick="submitGames()">Avançar para o pagamento →</button><p class="hint" id="minhint"></p></aside></div>
<div class="sbar"><div class="si"><b id="sb1"></b><small id="sb2"></small></div><button class="btn" onclick="submitGames()">Avançar →</button></div>`,{focus:1});paintPlay()}
function paintPlay(){const sel=[...S.sel].sort((a,b)=>a-b);
$('#tray').innerHTML=Array.from({length:6},(_,i)=>sel[i]?`<span class="ball lg">${pad(sel[i])}</span>`:'<span class="slot"></span>').join('');
document.querySelectorAll('#grid .num').forEach(b=>{const n=+b.dataset.n,on=S.sel.includes(n);b.classList.toggle('on',on);b.classList.toggle('dim',!on&&S.sel.length>=6)});
const ab=$('#addb');ab.disabled=S.sel.length!==6;ab.textContent=`➕ Adicionar jogo (${S.sel.length}/6)`;
$('#draft').innerHTML=S.draft.map((g,i)=>{const dup=S.dup&&g.join('-')===S.dup;return`<div class="dr ${dup?'dup':''}"><div>${g.map(n=>`<span class="ball sm">${pad(n)}</span>`).join('')}${dup?'<div class="dupmsg">Já escolhido por alguém — troque este jogo</div>':''}</div><button class="x" onclick="rmDraft(${i})" aria-label="Remover jogo">🗑</button></div>`}).join('')||'<p class="muted empty">Nenhum jogo ainda. Escolha 6 números e toque em <b>Adicionar jogo</b>.</p>';
const tot=S.draft.length*PRICE,falta=S.need-S.draft.length;
$('#cnt').textContent=S.draft.length;$('#tot').textContent=R(tot);
const hint=falta>0?`Faltam ${falta} jogo(s) para o mínimo${S.have?` (você já tem ${S.have})`:''}.`:'Tudo certo! Pode avançar para o pagamento.';
$('#minhint').textContent=hint;$('#sb1').textContent=R(tot);$('#sb2').textContent=falta>0?`faltam ${falta} jogo(s) · ${S.draft.length} no total`:`${S.draft.length} jogo(s)`}
function tog(n){const i=S.sel.indexOf(n);if(i>=0)S.sel.splice(i,1);else if(S.sel.length<6)S.sel.push(n);paintPlay()}
const rand6=()=>{const s=new Set;while(s.size<6)s.add(1+Math.floor(Math.random()*60));return[...s].sort((a,b)=>a-b)};
function lucky(){S.sel=rand6();paintPlay()}
function luckyN(n){let k=0,t=0;while(k<n&&t++<200){const g=rand6();if(!S.draft.some(x=>x.join()===g.join())){S.draft.push(g);k++}}S.sel=[];paintPlay()}
function addG(){if(S.sel.length!==6)return toast('Escolha exatamente 6 números.','err');const k=[...S.sel].sort((a,b)=>a-b);if(S.draft.some(g=>g.join()===k.join()))return toast('Você já adicionou esse jogo.','err');S.draft.push(k);S.sel=[];paintPlay()}
function rmDraft(i){S.draft.splice(i,1);S.dup=null;paintPlay()}
async function submitGames(){if(S.sel.length===6)addG();else if(S.sel.length>0)return toast('Você começou um jogo com '+S.sel.length+' número(s). Complete os 6 ou toque em Limpar.','err');
if(S.draft.length<S.need)return toast('Adicione pelo menos '+S.need+' jogo(s).','err');
const d=await api('/games',{...S.auth,games:S.draft});
if(!d){if(S.err&&S.err.d&&S.err.d.dup){S.dup=S.err.d.dup.join('-');paintPlay();ask({title:'Número repetido 🍀',msg:`<p>${esc(S.err.message)}</p>`,ok:'Entendi',cancel:false})}return}
S.draft=[];S.dup=null;nav('/pagar/'+d.batch)}

async function pay(batch){const d=await me();if(!d)return;const gs=d.games.filter(g=>g.b===batch);
if(!gs.length){view(`<div class="card center paywrap"><h2>Reserva não encontrada</h2><p class="muted" style="margin:8px 0 18px">Esses jogos podem ter expirado ou sido removidos.</p><a class="btn" href="#/meus">Ver meus jogos</a></div>`);return}
const total=gs.length*PRICE,c=S.cfg,list=`<div style="margin:6px 0">${gs.map(g=>`<div>${balls(g,null,'sm')}</div>`).join('')}</div>`;
if(gs.every(g=>g.status==='PAGO')){view(`<div class="card center paywrap"><div style="font-size:54px">✅</div><h2>Pagamento confirmado!</h2><p class="muted" style="margin:6px 0">${gs.length} jogo(s) · ${R(total)}</p>${list}<a class="btn big" href="#/meus">Ver meus jogos</a></div>`);return}
if(!c.pixKey){view(`<div class="card center paywrap"><h2>Pix ainda não configurado</h2><p class="muted" style="margin:8px 0 18px">Seus jogos estão reservados, mas o administrador ainda não cadastrou a chave Pix. Avise-o e volte em seguida.</p><a class="btn" href="#/meus">Ver meus jogos</a></div>`);return}
const code=pix(c.pixKey,c.pixName,c.pixCity,total,'BOLAO'+batch),exp=Math.min(...gs.map(g=>g.at))+c.holdMin*60000,qr=qrSvg(code);
view(`<div class="paywrap"><div class="card center"><span class="pill">Pagamento via Pix</span><h2 style="margin-top:12px">${esc(S.auth.name)}, falta pouco!</h2>
<p class="muted" style="margin-top:6px">${gs.length} jogo(s) reservado(s)</p><div class="amount">${R(total)}</div>
<div class="notice paynote">💸 <b>Pagamento no momento da realização do jogo</b></div><p style="margin:12px 0">${esc(c.msgPay)}</p><span class="tm">⏳ Reserva expira em <span id="cd"></span></span>
${qr?`<div class="qrbox">${qr}</div><p class="hint" style="margin-top:0">Abra o app do seu banco → Pix → <b>Ler QR Code</b></p>`:'<p class="hint">Não foi possível gerar o QR Code. Use o código abaixo.</p>'}
<div class="code" id="cc">${esc(code)}</div><button class="btn big" onclick="copyText($('#cc').textContent)">📋 Copiar Pix Copia e Cola</button>
<p class="hint">Recebedor: <b>${esc(c.pixName)}</b> · ${esc(c.pixCity)}</p>
<ul class="ol"><li><span>1</span>Pague agora o valor exato de ${R(total)} pelo Pix, no momento do jogo.</li><li><span>2</span><p>O administrador confirma o pagamento e seus jogos passam a <b>PAGO</b>.</p></li><li><span>3</span>Acompanhe tudo em “Meus jogos”.</li></ul>
${list}<a class="btn ghost big" href="#/meus" style="margin-top:8px">Ver meus jogos</a></div></div>`);
const tickf=()=>{const e=$('#cd');if(!e)return clearInterval(S.tick);const ms=exp-Date.now();e.textContent=ms>0?Math.floor(ms/6e4)+':'+pad(Math.floor(ms%6e4/1000)):'expirada'};tickf();S.tick=setInterval(tickf,1000)}

async function mine(res){const d=await me();if(!d)return;const r=d.result,gs=d.games,idx=Object.fromEntries(gs.map((g,i)=>[g.id,i+1])),hold=S.cfg.holdMin;
const seg=`<div class="seg"><a href="#/meus" class="${res?'':'on'}">📋 Meus jogos</a><a href="#/resultados" class="${res?'on':''}">🏆 Resultados</a></div>`;
const prizes=d.prizes.map(p=>`<div class="card prize"><div style="font-size:42px">🎉</div><h3>VOCÊ FOI PREMIADO!</h3><p>Faixa: <b>${TIER[p.tier]}</b> · Jogos premiados: ${p.games.length}</p><p class="muted">Valor individual</p><div class="v">${R(p.each)}</div></div>`).join('');
const draw=res?(r?`<div class="card draw"><b>🎯 Números sorteados</b><div class="tray">${r.map(n=>`<span class="ball lg hit">${pad(n)}</span>`).join('')}</div></div>`:'<div class="card center muted">O resultado ainda não foi publicado. Volte depois do sorteio! 🍀</div>'):'';
const list=groupB(gs).map(bg=>{const pd=bg.every(g=>g.status==='PAGO'),exp=Math.min(...bg.map(g=>g.at))+hold*60000;
return`<div class="card bt"><div class="bth"><span><span class="st ${pd?'PAGO':'PENDENTE'}">${pd?'PAGO':'PENDENTE'}</span> <small class="muted"><b>${fmtT(bg[0].at)}</b> · ${R(bg.length*PRICE)}</small></span>${pd?'':`<a class="btn sm gold" href="#/pagar/${bg[0].b}">💸 Pagar com Pix</a>`}</div>
${pd?'':`<small class="muted">Reserva expira às ${fmtT(exp)}</small>`}
${bg.map(g=>{const h=r?hitsOf(g,r).length:null;return`<div class="gm"><small>Jogo ${pad(idx[g.id])}</small>${balls(g,r)}${h!==null?`<small>${h} acerto(s)${TIER[h]?' – '+TIER[h].toUpperCase():''}</small>`:''}</div>`}).join('')}</div>`}).join('')||'<div class="card center"><p class="muted" style="margin-bottom:14px">Você ainda não tem jogos.</p><a class="btn" href="#/jogar">🎲 Fazer jogos</a></div>';
view(`<div class="paywrap" style="max-width:680px">${seg}${prizes}${draw}<div style="height:14px"></div>${list}</div>`)}

view(`<div class="paywrap"><form class="card login" onsubmit="return doAdm(event,${first})"><span class="pill">Administração</span><h2 style="margin-top:12px">${first?'Crie a senha do administrador':'Acesso do administrador'}</h2>

function admOut(silent){S.adm='';S.st=null;try{sessionStorage.removeItem('bolaoAdm')}catch{}if(silent===true)adminLogin();else nav('/')}
const TABS=[['p','📊','Painel'],['u','👥','Participantes'],['r','🎯','Resultado'],['w','🏆','Premiação'],['c','⚙️','Config'],['l','🕘','Histórico']];TABS.splice(2,0,['g','🗂️','Grupos']);

else $('#tabs').innerHTML=tabs;

const usersMap=s=>Object.fromEntries(s.users.map(x=>[x.id,x]));
function tabP(s){const u=usersMap(s),ps=s.games.filter(g=>g.status==='PAGO').length,pe=s.games.length-ps,pb=groupB(s.games.filter(g=>g.status!=='PAGO')),over=s.config.payDeadline&&Date.now()>new Date(s.config.payDeadline);
const st=[['👥','Participantes',s.users.length],['🎟️','Jogos',s.games.length],['✅','Pagos',ps],['⏳','Pendentes',pe],['💰','Recebido',R(ps*PRICE)],['🕓','A receber',R(pe*PRICE)]];
return`<div class="sgrid">${st.map(([i,l,v])=>`<div class="stat"><i>${i}</i><small>${l}</small><b>${v}</b></div>`).join('')}</div>
${grpPanel(s)}
${over&&pe?`<div class="banner"><span>⏰ O prazo de pagamento terminou e ainda há <b>${pe}</b> jogo(s) pendente(s).</span><button class="btn sm danger" onclick="purge(${pe})">Excluir pendentes</button></div>`:''}
<h3 class="h3">Aguardando pagamento (${pb.length})</h3><div class="card" style="padding:6px 16px">${pb.map(bg=>{const x=u[bg[0].uid]||{name:'?'};return`<div class="qi"><div><b>${esc(x.name)}</b><br><small class="muted">${fmtT(bg[0].at)} · ${bg.length} jogo(s) · ${R(bg.length*PRICE)}</small></div><div class="row" style="flex:none"><button class="btn sm ghost" data-q="${esc(x.name)}" onclick="S.q=this.dataset.q;S.tab='u';adm(true)">Ver</button><button class="btn sm" onclick="payB('${bg[0].b}',true)">✔ Marcar como pago</button></div></div>`}).join('')||'<p class="muted empty">Nenhum pagamento pendente 🎉</p>'}</div>
<div style="margin-top:14px"><button class="btn ghost sm" onclick="csv()">⬇ Exportar CSV</button></div>`}
function tabU(s){const fl=[['all','Todos'],...GRP().map(g=>['g_'+g.id,'👥 '+g.name]),['g_none','Sem grupo'],['pend','Com pendências'],['paid','Tudo pago'],['none','Sem jogos']];
return`<div class="card"><div class="tools"><input id="q" type="search" placeholder="🔍 Buscar por nome ou Pix" value="${esc(S.q)}" oninput="S.q=this.value;paintU()"><button class="btn ghost sm" onclick="csv()">⬇ CSV</button></div>
<div class="fchips">${fl.map(([k,t])=>`<button class="fc ${S.pf===k?'on':''}" onclick="S.pf='${k}';adm()">${esc(t)}</button>`).join('')}</div></div><div id="ulist">${ulist(s)}</div>`}
const paintU=()=>{$('#ulist').innerHTML=ulist(S.st)};
function ulist(s){const r=s.result?s.result.nums:null,q=kk(S.q);
const rows=s.users.map(u=>{const gs=s.games.filter(g=>g.uid===u.id);return{u,gs,last:Math.max(u.at||0,...gs.map(g=>g.at)),pe:gs.filter(g=>g.status!=='PAGO').length}})
.filter(o=>(!q||kk(o.u.name).includes(q)||kk(o.u.pix).includes(q))&&(S.pf==='all'||(S.pf==='pend'&&o.pe)||(S.pf==='paid'&&o.gs.length&&!o.pe)||(S.pf==='none'&&!o.gs.length)||(S.pf==='g_none'&&!o.u.group)||(S.pf.startsWith('g_')&&S.pf!=='g_none'&&o.u.group===S.pf.slice(2)))).sort((a,b)=>b.last-a.last);
return rows.map(({u,gs,pe})=>{const open=S.open[u.id];
return`<div class="ucard ${open?'open':''}"><div class="uh" onclick="togU('${u.id}')"><span class="av">${esc(u.name.trim()[0]||'?')}</span><div class="um"><b>${esc(u.name)}</b><small>${esc(pixShow(u.pix))}</small>
<div class="sum"><select class="gsel" aria-label="Grupo do participante" onclick="event.stopPropagation()" onchange="setGrp('${u.id}',this.value)">${gopt(u.group)}</select><span class="sm2">🎟️ ${gs.length} jogo(s)</span><span class="sm2">💰 ${R(gs.length*PRICE)}</span>${pe?`<span class="st PENDENTE">${pe} pendente(s)</span>`:''}${gs.length&&!pe?'<span class="st PAGO">TUDO PAGO</span>':''}</div></div><span class="chev">▾</span></div>
${open?`<div class="ub"><div class="row" style="margin:10px 0"><button class="btn sm ghost" data-copy="${esc(pixVal(u.pix))}" onclick="copyText(this.dataset.copy)">📋 Copiar Pix</button><button class="btn sm dgh" onclick="delU('${u.id}')">🗑 Excluir participante</button></div>
${groupB(gs).map(bg=>{const pd=bg.every(g=>g.status==='PAGO');return`<div class="gm"><div class="bth"><span><span class="st ${pd?'PAGO':'PENDENTE'}">${pd?'PAGO':'PENDENTE'}</span> <small class="muted"><b>${fmtT(bg[0].at)}</b> · ${R(bg.length*PRICE)}</small></span><button class="btn sm ${pd?'ghost':''}" onclick="payB('${bg[0].b}',${!pd})">${pd?'Voltar p/ pendente':'✔ Marcar como pago'}</button></div>
${bg.map(g=>{const h=r?hitsOf(g,r).length:null;return`<div class="gl"><div>${balls(g,r,'sm')}${h!==null?`<small class="muted"> ${h} acerto(s)</small>`:''}</div><button class="x" onclick="delG('${g.id}')" aria-label="Excluir jogo" title="Excluir jogo">🗑</button></div>`}).join('')}</div>`}).join('')||'<p class="muted empty">Sem jogos ainda.</p>'}</div>`:''}</div>`}).join('')||'<div class="card center muted" style="margin-top:12px">Nenhum participante encontrado.</div>'}
const GRP=()=>S.st.groups||[];
const gopt=g=>[['','Sem grupo'],...GRP().map(x=>[x.id,x.name])].map(([v,t])=>`<option value="${esc(v)}" ${(g||'')===v?'selected':''}>${esc(t)}</option>`).join('');
const gbadge=g=>{if(!GL[g])return'<span class="gb none">Sem grupo</span>';let h=0;for(const c of g)h=(h*31+c.charCodeAt(0))%360;return`<span class="gb" style="background:hsl(${h} 65% 90%);color:hsl(${h} 60% 28%)">${esc(GL[g])}</span>`};
async function setGrp(id,g){if(await api('/a/group',{uid:id,group:g},1))reload('Grupo atualizado ✅')}
function grpPanel(s){const nog=s.users.filter(u=>!u.group).length,rows=GRP().map(g=>{const us=s.users.filter(u=>u.group===g.id),ids=new Set(us.map(u=>u.id)),gs=s.games.filter(x=>ids.has(x.uid)),pd=gs.filter(x=>x.status==='PAGO').length;return`<div class="stat"><small>👥 ${esc(g.name)}</small><b>${R(pd*PRICE)}</b><small>${us.length} participante(s) · ${gs.length} jogo(s) · ${pd} pago(s)</small></div>`}).join('');
return`<div class="row" style="align-items:center;justify-content:space-between;margin-top:6px"><h3 class="h3" style="margin:0">Por grupo</h3><button class="btn ghost sm" style="flex:none" onclick="S.tab='g';adm(true)">🗂️ Gerenciar grupos</button></div><div class="ggrid" style="margin-top:10px">${rows||'<div class="card muted center">Nenhum grupo criado.</div>'}</div>${nog?`<div class="banner"><span>👥 <b>${nog}</b> participante(s) ainda sem grupo. Só quem tem grupo entra na divisão do prêmio.</span><button class="btn sm" onclick="S.pf='g_none';S.tab='u';adm(true)">Classificar</button></div>`:''}`}
/* ---- Gerenciar grupos ---- */
function tabG(s){const gs=GRP(),mem=id=>s.users.filter(u=>(u.group||'')===id).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
const row=u=>`<div class="qi"><div><b>${esc(u.name)}</b></div><select class="gsel" style="flex:none" aria-label="Mover ${esc(u.name)}" onchange="mvU('${u.id}',this.value)">${gopt(u.group)}</select></div>`;
const card=g=>{const us=mem(g.id),edit=S.ge===g.id,others=s.users.filter(u=>(u.group||'')!==g.id).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
return`<div class="card" style="margin-bottom:12px"><div class="row" style="align-items:center;gap:8px">${edit?`<input id="gn_${g.id}" maxlength="30" value="${esc(g.name)}" style="flex:1;min-width:0" onkeydown="if(event.key==='Enter')grpRen('${g.id}')"><button class="btn sm" style="flex:none" onclick="grpRen('${g.id}')">Salvar</button><button class="btn ghost sm" style="flex:none" onclick="S.ge='';adm()">Cancelar</button>`:`<h3 style="margin:0;flex:1;min-width:0">${esc(g.name)} <small class="muted">· ${us.length}</small></h3><button class="btn ghost sm" style="flex:none" onclick="S.ge='${g.id}';adm();setTimeout(()=>{const i=$('#gn_${g.id}');i&&i.focus()},0)">✏️ Renomear</button><button class="btn ghost sm danger" style="flex:none" onclick="grpDel('${g.id}')">🗑 Excluir</button>`}</div>
<div style="margin-top:8px">${us.map(row).join('')||'<p class="muted empty">Nenhum participante neste grupo.</p>'}</div>
<select style="margin-top:10px" aria-label="Adicionar participante a ${esc(g.name)}" onchange="if(this.value)mvU(this.value,'${g.id}')"><option value="">➕ Adicionar / transferir participante…</option>${others.map(u=>`<option value="${u.id}">${esc(u.name)} (${esc(GL[u.group]||'sem grupo')})</option>`).join('')}</select></div>`};
const nog=mem('');
return`<div class="card"><h3>Gerenciar grupos</h3><p class="muted" style="margin:4px 0 0">Crie grupos com o nome que quiser (ex.: Família 1, Trabalho 2, Amigos). A tela de participação não muda. A divisão do prêmio é feita por grupo, na aba Premiação.</p>
<div class="row" style="margin-top:12px;gap:8px"><input id="ng" maxlength="30" placeholder="Nome do novo grupo" style="flex:1;min-width:0" onkeydown="if(event.key==='Enter')grpNew()"><button class="btn" style="flex:none" onclick="grpNew()">➕ Criar grupo</button></div></div>
<h3 class="h3">Grupos (${gs.length})</h3>${gs.map(card).join('')||'<div class="card muted center">Nenhum grupo criado ainda.</div>'}
<h3 class="h3">Sem grupo (${nog.length})</h3><div class="card" style="padding:6px 16px">${nog.map(row).join('')||'<p class="muted empty">Todos os participantes têm grupo 🎉</p>'}</div>`}
async function grpNew(){const v=$('#ng').value;if(await api('/a/grpSave',{name:v},1))reload('Grupo criado ✅')}
async function grpRen(id){const v=$('#gn_'+id).value;if(await api('/a/grpSave',{id,name:v},1)){S.ge='';reload('Grupo renomeado ✅')}}
async function mvU(uid,g){if(await api('/a/grpMove',{uids:[uid],group:g},1))reload('Participante movido ✅')}
async function grpDel(id){const n=S.st.users.filter(u=>u.group===id).length,pz=S.st.prizes.some(p=>p.group===id);
if(!await ask({title:'Excluir grupo?',msg:`<p>O grupo <b>${esc(GL[id]||'')}</b> será excluído. ${n?`Os <b>${n}</b> participante(s) ficarão <b>sem grupo</b> (nenhum participante ou jogo é apagado).`:'Ele está vazio.'}</p>${pz?'<p class="hint">As premiações já publicadas desse grupo continuam visíveis.</p>':''}`,ok:'Excluir grupo',danger:true}))return;
if(await api('/a/grpDel',{id},1)){if(S.pf==='g_'+id)S.pf='all';if(S.gf===id)S.gf='';reload('Grupo excluído')}}
const togU=id=>{S.open[id]=!S.open[id];paintU()};
async function payB(b,p){if(await api('/a/paid',{b,paid:p},1))reload(p?'Pagamento confirmado ✅':'Voltou para pendente')}
async function delG(id){const g=S.st.games.find(x=>x.id===id);if(!g)return;if(!await ask({title:'Excluir este jogo?',msg:`<p>${balls(g,null,'sm')}</p><p class="muted" style="margin-top:8px">O jogo será removido do banco de dados e a combinação ficará livre para outras pessoas.</p>`,ok:'Excluir jogo',danger:true}))return;
if(await api('/a/delGame',{id},1))reload('Jogo excluído')}
async function delU(id){const u=S.st.users.find(x=>x.id===id),n=S.st.games.filter(g=>g.uid===id).length;if(!u)return;
if(!await ask({title:'Excluir participante?',msg:`<p><b>${esc(u.name)}</b> e <b>${n} jogo(s)</b> serão removidos do banco de dados. Essa ação não pode ser desfeita.</p>`,ok:'Excluir tudo',danger:true}))return;
if(await api('/a/delUser',{uid:id},1)){delete S.open[id];reload('Participante excluído')}}
async function purge(n){if(!await ask({title:'Excluir jogos pendentes?',msg:`<p>${n} jogo(s) sem pagamento serão removidos e as combinações ficarão livres.</p>`,ok:'Excluir pendentes',danger:true}))return;if(await api('/a/purgePending',{},1))reload('Pendentes excluídos')}
function tabR(s){const r=s.result?s.result.nums:null,u=usersMap(s),rows=r?s.games.map(g=>({g,x:u[g.uid]||{name:'?'},h:hitsOf(g,r)})).filter(o=>(S.f===''||o.h.length==S.f)&&(S.gf===''||(S.gf==='none'?!o.x.group:o.x.group===S.gf))).sort((a,b)=>b.h.length-a.h.length):[];
return`<div class="card"><h3>Números sorteados</h3><p class="muted" style="margin:4px 0 12px">Informe as 6 dezenas do sorteio.</p><div class="six">${[0,1,2,3,4,5].map(i=>`<input class="rn" type="number" inputmode="numeric" min="1" max="60" value="${r?r[i]:''}" aria-label="Número ${i+1}">`).join('')}</div>
<div class="row" style="margin-top:14px"><button class="btn ghost" onclick="saveR(0)">Conferir jogos</button><button class="btn gold" onclick="saveR(1)">Publicar para os participantes ${s.result&&s.result.published?'(publicado ✔)':''}</button></div></div>
${r?`<div class="card" style="margin-top:14px"><div class="tools"><select onchange="S.f=this.value;adm()" style="max-width:240px"><option value="">Todos os acertos</option>${[0,1,2,3,4,5,6].map(i=>`<option ${S.f!==''&&S.f==i?'selected':''} value="${i}">${i} acerto(s)</option>`).join('')}</select><select onchange="S.gf=this.value;adm()" style="max-width:200px"><option value="">Todos os grupos</option>${GRP().map(g=>`<option value="${esc(g.id)}" ${S.gf===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}<option value="none" ${S.gf==='none'?'selected':''}>Sem grupo</option></select><span class="muted">${rows.length} jogo(s)</span></div>
<div class="tw"><table>${rows.map(o=>`<tr><td><b>${esc(o.x.name)}</b><br>${gbadge(o.x.group)} <span class="st ${o.g.status}">${o.g.status}</span></td><td>${balls(o.g,r,'sm')}</td><td><b>${o.h.length}</b> ${TIER[o.h.length]||''}</td></tr>`).join('')}</table></div></div>`:''}`}
async function saveR(pub){const nums=[...document.querySelectorAll('.rn')].map(i=>+i.value);if(pub&&!await ask({title:'Publicar resultado?',msg:'<p>Todos os participantes poderão ver o sorteio e os acertos.</p>',ok:'Publicar'}))return;if(await api('/a/result',{nums,publish:!!pub},1))reload(pub?'Resultado publicado':'Resultado salvo')}
function tabW(s){return`<div class="card"><h3>Premiação</h3><p class="muted" style="margin:4px 0 0">Entram na divisão só os participantes do grupo escolhido, com jogos PAGOS. O valor é dividido por pessoa.</p>
<label for="tg">Grupo que ganhou</label><select id="tg">${GRP().map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')||'<option value="">Crie um grupo primeiro</option>'}</select><label for="tr">Faixa</label><select id="tr"><option value="4">Quadra</option><option value="5">Quina</option><option value="6">Sena</option></select><label for="tv">Valor total recebido na faixa (R$)</label><input id="tv" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
<div class="row" style="margin-top:16px"><button class="btn ghost" onclick="prize(0)">Calcular divisão</button><button class="btn gold" onclick="prize(1)">Confirmar e publicar</button></div><div id="pv" style="margin-top:14px"></div></div>
<h3 class="h3">Premiações publicadas</h3>${s.prizes.map(p=>`<div class="card" style="margin-bottom:10px"><b>${(p.gname||GL[p.group])?'Bolão '+esc(p.gname||GL[p.group])+' · ':''}${TIER[p.tier]}</b> – ${R(p.total)} ÷ ${p.uids.length} = <b>${R(p.each)}</b> por pessoa</div>`).join('')||'<div class="card muted center">Nenhuma ainda.</div>'}`}
async function prize(pub){if(pub&&!await ask({title:'Publicar divisão?',msg:'<p>Os ganhadores verão o valor no app.</p>',ok:'Publicar'}))return;
const d=await api('/a/prize',{tier:$('#tr').value,total:$('#tv').value,group:$('#tg').value,publish:!!pub},1);if(!d)return;
$('#pv').innerHTML=`<div class="notice">${d.uids.length} pessoa(s) contemplada(s) (${d.games} jogo(s)): ${d.uids.map(esc).join(', ')||'—'}<br>Valor individual: <b>${R(d.each)}</b></div>${d.sem&&d.sem.length?`<div class="notice warn" style="margin-top:8px">⚠️ Ganhador(es) pago(s) sem grupo, fora da divisão: ${d.sem.map(esc).join(', ')}</div>`:''}`;if(pub)reload('Premiação publicada')}
function tabC(s){const c=s.config,f=(k,l,t='text',h='')=>`<label for="f_${k}">${l}</label><input id="f_${k}" data-k="${k}" type="${t}" value="${esc(c[k]??'')}" ${k==='pixKey'?`oninput="pxLive(this,'pixc')"`:''}>${h?`<p class="hint" style="margin-top:6px">${h}</p>`:''}`,ta=(k,l)=>`<label for="f_${k}">${l}</label><textarea id="f_${k}" data-k="${k}">${esc(c[k]??'')}</textarea>`;
return`<div class="card cfg" id="cfgf"><h3>Bolão</h3>${f('name','Nome do bolão')}<h3>Recebimento via Pix</h3>${f('pixKey','Chave Pix (recebimento)','text','O tipo da chave é reconhecido automaticamente (CPF, CNPJ, e-mail, celular ou aleatória).')}<div class="pxs" id="pixc">${pxHtml(detectPix(c.pixKey))}</div>${f('pixName','Nome do recebedor (máx. 25)')}${f('pixCity','Cidade (máx. 15)')}
<div style="margin-top:14px"><button class="btn ghost sm" onclick="testPix()">🔍 Testar QR Code Pix</button></div>
<h3>Prazos</h3>${f('deadline','Prazo final de participação','datetime-local')}${f('payDeadline','Prazo final de pagamento','datetime-local')}${f('holdMin','Reserva de jogos pendentes (minutos)','number','Depois desse tempo, jogos sem pagamento são liberados automaticamente.')}
<h3>Mensagens</h3>${ta('msgHome','Mensagem inicial')}${ta('msgPay','Mensagem de pagamento')}${ta('msgDup','Mensagem de número repetido')}
<label class="sw"><input type="checkbox" id="cl" ${c.closed?'checked':''}> 🔒 Encerrar inscrições agora</label><div style="margin-top:18px"><button class="btn big" onclick="saveC()">Salvar configurações</button></div></div>`}
const cv=k=>$('#cfgf [data-k='+k+']').value;
function testPix(){if(!detectPix(cv('pixKey')).ok)return toast('Preencha uma chave Pix válida primeiro.','err');ask({title:'Teste do QR Pix (R$ 6,00)',msg:`<div class="qrbox">${qrSvg(pix(cv('pixKey'),cv('pixName'),cv('pixCity'),PRICE,'TESTE'+rid()))}</div><p class="hint center">Escaneie com o app do banco só para conferir o recebedor. Não precisa pagar.</p>`,ok:'Fechar',cancel:false})}
async function saveC(){const b={};document.querySelectorAll('#cfgf [data-k]').forEach(i=>b[i.dataset.k]=i.type==='number'?+i.value:i.value);b.closed=$('#cl').checked;if(!String(b.name).trim())return toast('Informe o nome do bolão.','err');if(String(b.pixKey||'').trim()){const kd=detectPix(b.pixKey);if(!kd.ok)return toast('Chave Pix inválida: '+(kd.msg||'confira o formato.'),'err');b.pixKey=kd.value}
if(await api('/a/cfg',b,1)){S.cfg={...S.cfg,...b};$('#ttl').textContent=b.name;reload('Configurações salvas ✅')}}
function tabL(s){return`<div class="card">${s.log.map(l=>`<div class="log"><time>${fmtT(l.t)}</time><span>${esc(l.m)}</span></div>`).join('')||'<p class="muted empty">Sem registros.</p>'}</div>`}
function csv(){const u=usersMap(S.st),q=v=>{v=String(v??'');if(/^[=@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'},l=['Nome;Grupo;Pix;Jogo;Status;Data'];
S.st.games.forEach(g=>{const x=u[g.uid]||{};l.push([x.name,GL[x.group]||'',x.pix,g.nums.map(pad).join('-'),g.status,new Date(g.at).toLocaleString('pt-BR')].map(q).join(';'))});
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+l.join('\n')],{type:'text/csv'}));a.download='bolao.csv';a.click()}

/* ================= INÍCIO DO APP ================= */
async function init(){busy(1);try{S.cfg=await srv('/cfg',{})}catch(e){A.innerHTML='<div class="card center"><h2>Não foi possível acessar o banco de dados</h2><p class="muted" style="margin-top:8px">Verifique BIN e KEY no topo do script (JSONBin) e sua conexão.</p></div>';return}finally{busy(-1)}
document.title=S.cfg.name;$('#ttl').textContent=S.cfg.name;route()}
init();
</script>
</body>
</html>
